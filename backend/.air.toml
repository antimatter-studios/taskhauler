root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/taskhauler-backend ."
  bin = "./tmp/taskhauler-backend"
  full_bin = "./tmp/taskhauler-backend"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", ".git"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
