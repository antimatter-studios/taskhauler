server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* is NOT proxied here. The DDT reverse proxy out front routes
    # /api/v1 -> taskhauler-backend-v1, /api/v2 -> taskhauler-backend-v2,
    # etc. before traffic ever reaches this container. Each API version is
    # a separate deployable; this nginx serves only the SPA.

    # SPA fallback: any non-asset path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static hashed assets aggressively; Vite emits hashed filenames.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
